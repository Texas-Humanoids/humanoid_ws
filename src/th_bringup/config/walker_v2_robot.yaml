# WalkerV2 hardware map: one entry per joint (10 RobStride motors), plus
# robot-wide settings. Launch with:
#   ros2 launch th_bringup robot.launch.py \
#     motors_config:=src/th_bringup/config/walker_v2_robot.yaml \
#     policy_spec:=policies/walker_v2/v6/policy_spec.json \
#     model_path:=policies/walker_v2/v6/policy.onnx walk_event:='A pressed'
#
# FILL IN before the first run (the launch refuses while any is null):
#   motor_id  - find_motor_id.sh can_usb. IDs follow the joint order of each leg
#               (hip pitch, hip roll, hip yaw, knee, ankle): left 1-5, right 11-15.
#   offset    - tools/walker/calibrate_offsets.py (robot hanging in the default pose)
# VERIFY:
#   direction - tools/walker/wiggle_test.py; +joint must move the foot as the URDF says
#               (pitch +: foot moves back; hip roll +: foot moves +y/left).
#   limits    - URDF limits; hip roll is narrowed on the inside (foot collision at ~17 deg).

# mit: motors run PD with the policy_spec kp/kd (what training assumed).
# csp: position mode with a 1 rad/s speed limit; bench only, the policy will not walk.
control_mode: mit
# Optional per motor: stand_kp / stand_kd, gains held during STAND instead of the policy's
# trained gains (see the ankles below).
# Damping (kp = 0) used whenever targets stop: before STAND, after BACK, after a fall.
damping_kd: 1.0
# Motor command/feedback exchange rate when no policy target arrives.
feedback_rate: 100.0

imu:
  # VN-100 over its FTDI cable (this path is the team's unit; `ls /dev/serial/by-id`).
  # vectornav_imu publishes in ROS frames (x forward, y left, z up; world ENU), not the
  # sensor's own FRD/NED, so world_frame stays enu.
  driver: vectornav
  port: /dev/serial/by-id/usb-FTDI_USB-RS232-WE_AV0LSON8-if00-port0
  baud: 115200
  rate: 200.0
  # Rotation taking IMU-frame vectors (ROS frames, as above) into base_link, [w, x, y, z].
  # Identity = VN-100 mounted flat, label up, its x arrow pointing forward. For other
  # mountings set it, then check `ros2 topic echo /policy_bridge/projected_gravity`
  # (upright: 0 0 -1; nose down: +x; left side down: +y).
  rotation: [1.0, 0.0, 0.0, 0.0]
  world_frame: enu

motors:
  - joint: left_hip_pitch_joint
    motor_id: null
    motor_model: RS03
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -0.7854
    upper: 0.7854
  - joint: left_hip_roll_joint
    motor_id: null
    motor_model: RS03
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -0.35
    upper: 0.7854
  - joint: left_hip_yaw_joint
    motor_id: null
    motor_model: RS02
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -0.7854
    upper: 0.7854
  - joint: left_knee_pitch_joint
    motor_id: null
    motor_model: RS03
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: 0.0
    upper: 2.0944
  - joint: left_ankle_pitch_joint
    motor_id: null
    motor_model: RS06
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -1.5708
    upper: 1.5708
    # STAND only: the trained ankle kp 30 cannot hold the robot's weight on PD alone
    # (needs ~80). The policy runs with its trained 30/1.5 once A is pressed.
    stand_kp: 80.0
    stand_kd: 3.0
  - joint: right_hip_pitch_joint
    motor_id: 11  # UUID 3f39300290613713
    motor_model: RS03
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -0.7854
    upper: 0.7854
  - joint: right_hip_roll_joint
    motor_id: 12  # UUID 484193c79c90b014
    motor_model: RS03
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -0.7854
    upper: 0.35
  - joint: right_hip_yaw_joint
    motor_id: null
    motor_model: RS02
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -0.7854
    upper: 0.7854
  - joint: right_knee_pitch_joint
    motor_id: 14  # UUID 8c8938000c333413
    motor_model: RS03
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: 0.0
    upper: 2.0944
  - joint: right_ankle_pitch_joint
    motor_id: null
    motor_model: RS06
    can_interface: can_usb
    direction: 1.0
    offset: null
    lower: -1.5708
    upper: 1.5708
    # STAND only: the trained ankle kp 30 cannot hold the robot's weight on PD alone
    # (needs ~80). The policy runs with its trained 30/1.5 once A is pressed.
    stand_kp: 80.0
    stand_kd: 3.0
