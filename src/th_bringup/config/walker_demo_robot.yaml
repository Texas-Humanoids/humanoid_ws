    motor_id: 12
    motor_model: RS03
    can_interface: can_right
    direction: -1.0  # PR #62 hand-turned 2026-11-18; confirm with bringup.py pulse
    offset: 0.3832  # zero +3 deg outward correction by eye 2026-11-19 (was 0.5135)
    lower: 0.0
