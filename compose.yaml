services:
  gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: humanoid-ros:gpu
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    devices:
      - nvidia.com/gpu=all
    stdin_open: true
    tty: true
    command: sleep infinity
    volumes:
      - .:/ws
