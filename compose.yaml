services:
  cpu:
    profiles: [cpu]
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: humanoid-ros:cpu
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    group_add:
      - "${VIDEO_GID:-44}"
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:/dev/video0
    stdin_open: true
    tty: true
    command: sleep infinity
    volumes:
      - .:/ws


  gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: humanoid-ros:gpu
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    group_add:
      - "${VIDEO_GID:-44}"
    devices:
      - nvidia.com/gpu=all
      - ${CAMERA_DEVICE:-/dev/video0}:/dev/video0
    stdin_open: true
    tty: true
    command: sleep infinity
    volumes:
      - .:/ws

  # On the robot computer (e.g. Jetson Orin Nano): host networking for CAN, and
  # /dev plus udev so SDL can find a Bluetooth or USB controller. Runs as root
  # so it can bring up CAN and read /dev/input.
  robot:
    profiles: [robot]
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: humanoid-ros:cpu
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: sleep infinity
    volumes:
      - .:/ws
      - /dev:/dev
      - /run/udev:/run/udev:ro

  # On the robot computer, next to `robot`: th_autonomy's person follower, whose
  # pose model needs the GPU (TensorRT). Same ROS network as `robot` (host
  # networking and shared memory); only the GPU, no hardware access.
  perception:
    profiles: [robot]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: humanoid-ros:gpu
    network_mode: host
    ipc: host
    runtime: nvidia  # the Jetson's GPU (its driver has no CDI spec for `devices: nvidia.com/gpu`)
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
    command: sleep infinity
    volumes:
      - .:/ws
